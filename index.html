<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>고양시 SK브로드밴드 B 다이렉트 바로가입 센터</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <style>
    :root {
      --sk-red: #ea002c;
      --sk-red-light: #ff2a54;
      --sk-gradient: linear-gradient(135deg, #ea002c 0%, #ff4b4b 100%);
      --bg-dark: #0b0f19;
      --card-bg: #131b2e;
      --card-border: #1f293d;
      --card-active: #ea002c;
      --text-white: #ffffff;
      --text-gray: #94a3b8;
      --text-muted: #64748b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Pretendard", -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-white); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 32px 16px; }
    
    .wrapper { max-width: 540px; width: 100%; background: #0f172a; border-radius: 24px; border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); overflow: hidden; }
    
    /* 상단 B다이렉트샵 헤더 */
    .hero { background: radial-gradient(circle at top right, rgba(234, 0, 44, 0.25), transparent 60%), #0b0f19; padding: 36px 28px 28px; text-align: center; border-bottom: 1px solid rgba(255, 255, 255, 0.06); }
    .hero-tag { display: inline-flex; align-items: center; gap: 6px; background: rgba(234, 0, 44, 0.15); border: 1px solid rgba(234, 0, 44, 0.4); color: #ff6b81; padding: 6px 14px; border-radius: 9999px; font-size: 12px; font-weight: 700; margin-bottom: 14px; letter-spacing: -0.2px; }
    .hero h1 { font-size: 24px; font-weight: 800; line-height: 1.35; margin-bottom: 10px; letter-spacing: -0.5px; }
    .hero h1 span { color: #ff334b; }
    .hero p { font-size: 13.5px; color: var(--text-gray); line-height: 1.5; }
    
    /* 신뢰 포인트 바 */
    .trust-bar { display: grid; grid-template-columns: repeat(3, 1fr); background: #090d16; border-bottom: 1px solid rgba(255,255,255,0.05); padding: 12px 16px; text-align: center; }
    .trust-item { font-size: 11.5px; color: #cbd5e1; font-weight: 600; }
    .trust-item span { color: #ff4d6d; display: block; font-size: 10px; margin-bottom: 2px; }
    
    form { padding: 28px 24px; }
    .section-title { font-size: 14px; font-weight: 700; color: #e2e8f0; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; }
    .section-title .step { font-size: 11px; background: #1e293b; color: #94a3b8; padding: 2px 8px; border-radius: 6px; }

    /* 상품 선택 카드 */
    .plan-grid { display: grid; gap: 10px; margin-bottom: 24px; }
    .plan-card { position: relative; border: 1.5px solid var(--card-border); background: var(--card-bg); border-radius: 14px; padding: 14px 16px; cursor: pointer; transition: all 0.2s ease; display: flex; align-items: center; justify-content: space-between; }
    .plan-card input { display: none; }
    .plan-card:hover { border-color: rgba(234, 0, 44, 0.4); background: #162035; }
    .plan-card:has(input:checked) { border-color: var(--sk-red); background: rgba(234, 0, 44, 0.08); box-shadow: 0 0 0 1px var(--sk-red); }
    .plan-info { display: flex; flex-direction: column; gap: 3px; }
    .plan-title { font-size: 14.5px; font-weight: 700; color: #f1f5f9; display: flex; align-items: center; gap: 8px; }
    .plan-desc { font-size: 12px; color: var(--text-gray); }
    .plan-badge { font-size: 10.5px; font-weight: 700; padding: 2px 8px; border-radius: 4px; background: rgba(234, 0, 44, 0.2); color: #ff6b81; }
    .plan-badge.best { background: var(--sk-red); color: #fff; }
    .check-icon { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid #475569; display: flex; align-items: center; justify-content: center; font-size: 11px; color: transparent; }
    .plan-card:has(input:checked) .check-icon { border-color: var(--sk-red); background: var(--sk-red); color: #fff; }

    /* 혜택 선택 */
    .benefit-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 24px; }
    .benefit-card { border: 1.5px solid var(--card-border); background: var(--card-bg); border-radius: 12px; padding: 12px 14px; text-align: center; cursor: pointer; transition: all 0.2s; }
    .benefit-card input { display: none; }
    .benefit-card:has(input:checked) { border-color: var(--sk-red); background: rgba(234, 0, 44, 0.08); }
    .benefit-card .name { font-size: 13px; font-weight: 700; color: #f1f5f9; margin-bottom: 4px; display: block; }
    .benefit-card .sub { font-size: 11.5px; color: #ff6b81; display: block; }

    /* 입력 필드 */
    .form-group { margin-bottom: 18px; }
    label { display: block; font-size: 13px; font-weight: 600; color: #cbd5e1; margin-bottom: 8px; }
    label span { color: var(--sk-red); }
    input[type="text"], input[type="tel"], textarea {
      width: 100%; padding: 13px 16px; border: 1.5px solid var(--card-border); border-radius: 12px; font-size: 14px; color: #ffffff; background-color: #0b1120; outline: none; transition: all 0.2s;
    }
    input:focus, textarea:focus { border-color: var(--sk-red); box-shadow: 0 0 0 3px rgba(234, 0, 44, 0.15); }

    /* 버튼 */
    .submit-btn {
      width: 100%; background: var(--sk-gradient); color: #ffffff; border: none; padding: 17px; font-size: 16px; font-weight: 800;
      border-radius: 14px; cursor: pointer; transition: all 0.2s; box-shadow: 0 8px 24px rgba(234, 0, 44, 0.35); margin-top: 10px; letter-spacing: -0.3px;
    }
    .submit-btn:hover { transform: translateY(-1px); box-shadow: 0 10px 28px rgba(234, 0, 44, 0.45); }
    .footer-desc { text-align: center; font-size: 11.5px; color: var(--text-muted); margin-top: 18px; line-height: 1.5; }
  </style>
</head>
<body>

<div class="wrapper">
  <!-- 헤더 -->
  <div class="hero">
    <div class="hero-tag">B 다이렉트샵 공식 제휴 접수처</div>
    <h1>고양시 SK브로드밴드<br><span>바로가입 24시 접수센터</span></h1>
    <p>전화 영업 스트레스 없이 원하는 요금제를 셀프로 접수하세요.<br>일산 · 덕양 전 지역 전담 기사 우선 배정 & 당일 설치 지원</p>
  </div>

  <div class="trust-bar">
    <div class="trust-item"><span>혜택 01</span>더슬림 요금할인</div>
    <div class="trust-item"><span>혜택 02</span>SKT 결합할인</div>
    <div class="trust-item"><span>혜택 03</span>고양시 당일설치</div>
  </div>

  <!-- FormSubmit 연동: cfciss@gmail.com 자동 발송 -->
  <form action="https://formsubmit.co/cfciss@gmail.com" method="POST">
    <input type="hidden" name="_subject" value="[고양시 SKB 바로가입] 신규 접수">
    <input type="hidden" name="_captcha" value="false">
    <input type="hidden" name="_template" value="table">

    <!-- 1단계: 상품 선택 -->
    <div class="section-title">
      <span>1. 가입 희망 상품 선택</span>
      <span class="step">온라인 단독</span>
    </div>

    <div class="plan-grid">
      <label class="plan-card">
        <input type="radio" name="가입상품" value="500M 기가라이트 + B tv All (추천 1위)" checked>
        <div class="plan-info">
          <div class="plan-title">
            500M 기가라이트 + B tv All
            <span class="plan-badge best">인기 1위</span>
          </div>
          <div class="plan-desc">초고화질 스트리밍 + 250여 개 채널 베스트셀러</div>
        </div>
        <div class="check-icon">✓</div>
      </label>

      <label class="plan-card">
        <input type="radio" name="가입상품" value="100M 광랜 + B tv (실속형)">
        <div class="plan-info">
          <div class="plan-title">
            100M 광랜 + B tv
            <span class="plan-badge">실속형</span>
          </div>
          <div class="plan-desc">1~2인 가구, 웹서핑 & 유튜브 중심 알뜰 결합</div>
        </div>
        <div class="check-icon">✓</div>
      </label>

      <label class="plan-card">
        <input type="radio" name="가입상품" value="1G 기가인터넷 + B tv (프리미엄)">
        <div class="plan-info">
          <div class="plan-title">
            1G 기가인터넷 + B tv
            <span class="plan-badge">초고속</span>
          </div>
          <div class="plan-desc">대용량 다운로드 및 고사양 게이밍 최적화</div>
        </div>
        <div class="check-icon">✓</div>
      </label>

      <label class="plan-card">
        <input type="radio" name="가입상품" value="인터넷 단독 (100M/500M/1G)">
        <div class="plan-info">
          <div class="plan-title">인터넷 단독 상품</div>
          <div class="plan-desc">TV 없이 인터넷만 필요한 고객 전용</div>
        </div>
        <div class="check-icon">✓</div>
      </label>
    </div>

    <!-- 2단계: 혜택 선택 -->
    <div class="section-title">
      <span>2. 혜택 방식 선택</span>
      <span class="step">택 1</span>
    </div>
    <div class="benefit-grid">
      <label class="benefit-card">
        <input type="radio" name="혜택방식" value="더슬림 요금할인 (매월 최대 11,000원 추가할인)" checked>
        <span class="name">더슬림 요금할인</span>
        <span class="sub">매월 최대 11,000원 감면</span>
      </label>
      <label class="benefit-card">
        <input type="radio" name="혜택방식" value="신규 사은품 지원 (상품권/선물형)">
        <span class="name">신규 사은품 지원</span>
        <span class="sub">상품권 등 일시 지급형</span>
      </label>
    </div>

    <!-- 3단계: 신청자 정보 입력 (지역 선택 메뉴 제외됨) -->
    <div class="section-title">
      <span>3. 신청자 정보 입력</span>
      <span class="step">필수</span>
    </div>

    <div class="form-group">
      <label for="name">신청자 성함 <span>*</span></label>
      <input type="text" id="name" name="신청자명" placeholder="예: 홍길동" required>
    </div>

    <div class="form-group">
      <label for="phone">연락처 <span>*</span></label>
      <input type="tel" id="phone" name="연락처" placeholder="예: 010-1234-5678" required>
    </div>

    <div class="form-group">
      <label for="memo">설치 희망 주소 및 일정 (선택)</label>
      <textarea id="memo" name="희망일_상세주소" rows="2" placeholder="예: 삼송 OO아파트 O동, 토요일 오후 설치 희망"></textarea>
    </div>

    <button type="submit" class="submit-btn">⚡ 비대면 바로가입 신청 접수하기</button>

    <div class="footer-desc">
      접수 즉시 설치 가능 일정 확인 후 안내 문자/카톡이 발송됩니다.<br>
      수집된 정보는 가입 안내 및 설치 일정 조율 목적으로만 안전하게 사용됩니다.
    </div>
  </form>
</div>

</body>
</html>
