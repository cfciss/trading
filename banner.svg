<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 220" width="340" height="220">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="60%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e60012" />
      <stop offset="100%" stop-color="#ff3b30" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="340" height="220" rx="14" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5" />

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="340" height="5" rx="2" fill="url(#redGrad)" />

  <!-- Header Badge: B 다이렉트샵 -->
  <rect x="16" y="16" width="118" height="22" rx="11" fill="url(#redGrad)" />
  <text x="75" y="31" fill="#ffffff" font-family="'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">B 다이렉트 바로가입</text>

  <!-- Sub Badge: 고양시 전담 -->
  <text x="142" y="31" fill="#94a3b8" font-family="'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" font-size="10" font-weight="500">고양시 공식 전담 개통</text>

  <!-- Main Title -->
  <text x="16" y="68" fill="#ffffff" font-family="'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" font-size="18" font-weight="800" letter-spacing="-0.5">SK브로드밴드 인터넷</text>

  <!-- Discount Highlight -->
  <text x="16" y="96" fill="url(#goldGrad)" font-family="'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" font-size="14.5" font-weight="800">매월 최대 11,000원 추가할인!</text>

  <!-- Sub description bullets -->
  <circle cx="21" cy="116" r="2.5" fill="#e60012" />
  <text x="30" y="120" fill="#cbd5e1" font-family="'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" font-size="11">전화 통화 없는 24시 온라인 간편신청</text>

  <circle cx="21" cy="134" r="2.5" fill="#e60012" />
  <text x="30" y="138" fill="#cbd5e1" font-family="'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" font-size="11">일산·덕양 전 지역 당일/주말 빠른 설치</text>

  <!-- CTA Button -->
  <g transform="translate(16, 154)">
    <rect width="308" height="48" rx="10" fill="url(#redGrad)" />
    <!-- Light shine effect -->
    <path d="M 0 0 L 70 0 L 50 48 L 0 48 Z" fill="#ffffff" opacity="0.12" rx="10" />
    <text x="154" y="29" fill="#ffffff" font-family="'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" font-size="14.5" font-weight="800" text-anchor="middle" letter-spacing="-0.2">⚡ 간편 가입신청 하기 &gt;</text>
  </g>
</svg>